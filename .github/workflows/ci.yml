name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned so that a new Rust release cannot turn CI red on its own.
  # Bump it on purpose, together with `rustup update` locally.
  RUSTUP_TOOLCHAIN: "1.99.1"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update
      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component clippy --no-self-update
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Check the tools of the PTY tests
        # The PTY tests start the shell with `setsid -c` (util-linux) and read `/proc`.
        run: command -v setsid && test -r /proc/self/stat
      - name: Check the tools of the ssh tests
        # tests/ssh.rs fails on CI when a tool is missing (a skipped test would hide that it
        # never ran), so install sftp-server if the runner image lacks it.
        run: |
          command -v scp && command -v timeout
          if ! test -x /usr/lib/openssh/sftp-server; then
            echo "sftp-server is missing; installing openssh-sftp-server"
            sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-sftp-server
          fi
          test -x /usr/lib/openssh/sftp-server
      - name: Check the tools of the offline test
        # omsh-tests/tests/offline.rs runs the shell under `strace -f` to prove that a session
        # without AI makes no network socket, and uses bash for its positive control. It fails
        # on CI when a tool is missing (a skipped test would hide that it never ran).
        run: |
          if ! command -v strace; then
            echo "strace is missing; installing it"
            sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
          fi
          command -v strace && command -v bash
      - name: Run unit and conformance tests
        run: cargo test --workspace --exclude omsh-tests --locked
      - name: Run PTY tests
        # Every test has its own limit (60 s); this step limit is the second line of defense.
        timeout-minutes: 10
        run: cargo test -p omsh-tests --locked

  offline:
    name: Test with the network off
    # Gate C (blueprint section 21): the whole suite passes with no network. scripts/test-offline.sh
    # makes a network namespace that has only loopback (sudo, once), drops back to the runner's own
    # user id, checks that nothing outside loopback can be reached, and runs `cargo test --workspace`.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --no-self-update
      - name: Check the tools of the tests and of the script
        # Same needs as the Test job, plus the tools of scripts/test-offline.sh. A missing tool
        # fails the job (a skipped test would hide that it never ran).
        run: |
          command -v setsid && test -r /proc/self/stat
          command -v scp && command -v timeout
          if ! test -x /usr/lib/openssh/sftp-server || ! command -v strace; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-sftp-server strace
          fi
          test -x /usr/lib/openssh/sftp-server
          command -v strace && command -v bash && command -v sudo && command -v unshare && command -v setpriv && command -v ip && command -v getent
      - name: Run every test with the network off
        run: scripts/test-offline.sh
