[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/imshaid/oh-my-shell"

[workspace.dependencies]
# Internal crates. Allowed dependency direction (no cycles):
#   cli    -> editor, exec, ui, ai, safety, history, config, secrets
#   editor -> syntax, history, ui, config
#   exec   -> syntax, config
#   tests  -> cli, history (development only: the end-to-end tests run the shell's entry function;
#             `omsh-perf` fills a history file)
#   safety -> syntax
#   ai     -> config, secrets
#   history -> secrets
#   ui     -> config
# The version is repeated next to each path (keep it equal to `workspace.package.version`):
# `cargo deny` reads a path-only dependency of a publishable crate as a wildcard.
omsh-ai = { path = "crates/omsh-ai", version = "0.1.0" }
omsh-config = { path = "crates/omsh-config", version = "0.1.0" }
omsh-editor = { path = "crates/omsh-editor", version = "0.1.0" }
omsh-exec = { path = "crates/omsh-exec", version = "0.1.0" }
omsh-history = { path = "crates/omsh-history", version = "0.1.0" }
omsh-safety = { path = "crates/omsh-safety", version = "0.1.0" }
omsh-secrets = { path = "crates/omsh-secrets", version = "0.1.0" }
omsh-syntax = { path = "crates/omsh-syntax", version = "0.1.0" }
omsh-ui = { path = "crates/omsh-ui", version = "0.1.0" }

# External crates.
# clap's `color` feature is left out on purpose: plain help text does not need the
# extra crates it pulls in.
clap = { version = "4.6", default-features = false, features = [
    "derive",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
# Span-based error reports (S04). No `derive` and no `fancy`: the traits are implemented by
# hand, which keeps `syn` out of the binary, and the fancy renderer is for S05 to turn on.
miette = { version = "7.6", default-features = false }
# POSIX calls for the executor (S05): fork, waitpid, pipe2, access, sigaction. Default
# features are off; each feature below is one module of the crate that we use.
nix = { version = "0.31", default-features = false, features = ["fs", "poll", "process", "signal", "term", "user"] }
# TOML parser for the configuration file (S12). Without serde: the loader walks the parsed
# table key by key (`DeTable::parse_recoverable` keeps a span on every key and value), so one
# bad key can fall back to its default without losing the others.
toml = { version = "1.2", default-features = false, features = ["parse", "std"] }
# Local time for the optional `time` prompt segment (S13a). reedline already depends on it, so
# it adds no crate to the tree; only the `clock` feature (local time) is on.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Terminal control used by the editor crate, to put the terminal back in line mode when the
# editor's thread is abandoned or dies. reedline depends on it already, with the same version.
crossterm = { version = "0.29", default-features = false }
# Full-screen views (S27a), in `omsh-ui` only. ratatui draws into a buffer and writes only the cells
# that changed; its `crossterm` feature uses crossterm 0.29, the version already in the tree.
# Default features are off: `macros`, `layout-cache` and `underline-color` are not used.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Colors and text styles for the editor's highlighter (S14a): reedline draws with this crate's
# `Style` and does not re-export it. reedline depends on it already (0.50.3, MIT, nushell), so
# it adds no crate to the tree.
nu-ansi-term = { version = "0.50", default-features = false }
# Line editor (S13a). Default features are off: `sqlite`, `system_clipboard` and
# `external_printer` are not used (history is our own store in S13b; job notices are printed
# before the prompt, not above the line being typed).
reedline = { version = "0.52", default-features = false }
# SQLite for the command history (S13b). `bundled` compiles SQLite into the binary, so the
# shell does not depend on the system's library. Default features are off: the statement cache
# (`hashlink`) is not used.
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
# AI layer (S20), all in `omsh-ai` only. Nothing here starts before the first AI request.
# genai is the client for the five providers (§13.3). Its default features are off: they
# turn on `aws-lc-rs` (a large C build) and the system proxy settings. TLS is rustls with the
# `ring` provider, chosen below.
genai = { version = "0.7", default-features = false }
# genai's HTTP client. Not used directly: this entry only turns on TLS (`rustls-no-provider`:
# rustls with the platform's certificate verifier and no crypto provider of its own, so that
# `aws-lc-rs` stays out). The provider is installed by `omsh-ai` at the first request.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# The crypto provider for rustls: `ring` only. Default features off drops `aws-lc-rs`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# One small runtime, built at the first AI request (`current_thread`, no worker threads).
tokio = { version = "1.54", default-features = false, features = ["net", "rt", "sync", "time"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
# Credential stores (D7). keyring 4's own docs tell applications to link `keyring-core` and
# the store they want, not the `keyring` crate.
keyring-core = "1.0"
zbus-secret-service-keyring-store = { version = "1.0", features = ["crypto-rust"] }
# `omsh update` (S29b), in `omsh-cli` only. Both were in the tree already (reqwest, rustls), so they
# add no package. flate2 unpacks the release's `.tar.gz` (pure Rust `miniz_oxide`, MIT or Apache-2.0);
# ring makes the SHA-256 that is compared with `sha256.sum` (ISC-style license, already allowed).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ring = { version = "0.17", default-features = false }
# Wipes a key from memory when it is dropped.
zeroize = { version = "1", default-features = false, features = ["alloc"] }
# The plan the model sends back (S21, §13.4) is JSON. Both crates were in the tree already
# (genai, reedline), so they add no crate; only `omsh-ai` uses them. `serde_json` without
# `preserve_order`/`arbitrary_precision`: a plain parse into our own types.
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
# Edits `config.toml` and keeps its comments (the wizard writes the `[ai]` keys).
toml_edit = { version = "0.25", default-features = false, features = ["parse", "display"] }
# Test-only. Its `colors` feature is left out: it only colors the diff shown when a
# snapshot test fails.
insta = { version = "1.49", default-features = false }
# Test-only. Without its default features it drops the fork/timeout machinery
# (`rusty-fork`, `tempfile`) and `bit-set`.
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
# Only omsh-exec may use `unsafe`. It opts out of this rule in its crate root.
unsafe_code = "deny"

[workspace.lints.clippy]
# Panicking shortcuts are for tests only (see clippy.toml). A documented invariant
# in other code may opt out with `#[expect(clippy::expect_used, reason = "...")]`.
expect_used = "deny"
unwrap_used = "deny"
# Every lint opt-out must say why.
allow_attributes_without_reason = "deny"
# Every `unsafe` block needs a `// SAFETY:` comment.
undocumented_unsafe_blocks = "deny"

# The release binary (S19a). Measured on 2026-11-12 with `oh-my-shell` only: no LTO, no strip
# 20.8 MB (clean build 53 s); strip 16.0 MB; thin LTO + strip 15.8 MB (53 s); fat LTO + one
# codegen unit + strip 12.7 MB (99 s). Start, `--version` and idle memory did not differ beyond
# the noise of the runs, so size and build time decided. `panic` stays "unwind": the editor's
# thread is joined and its death is reported, and the tests use `catch_unwind`.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
