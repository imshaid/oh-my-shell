[package]
name = "omsh-syntax"
description = "Lexer, parser, AST, source spans and diagnostics for the Oh My Shell language."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bench]]
name = "parse"
harness = false

[lints]
workspace = true

[dependencies]
miette.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
# Only the tests render reports; the shell itself will do so from S05 on.
miette = { workspace = true, features = ["fancy-no-syscall"] }
