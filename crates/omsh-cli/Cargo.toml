[package]
name = "omsh-cli"
description = "The oh-my-shell binary: argument parsing, mode selection and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oh-my-shell"
path = "src/main.rs"

[dependencies]
# Local date and time in the `history` listing. Already in the tree through the editor.
chrono.workspace = true
clap.workspace = true
# `fancy-no-syscall` brings the graphical report renderer without the crates that probe the
# terminal; the shell does that itself, in `report.rs`.
# Ends the notification program with its group when it hangs (the same call as the prompt's
# `git`).
nix.workspace = true
miette = { workspace = true, features = ["fancy-no-syscall"] }
omsh-ai.workspace = true
omsh-config.workspace = true
omsh-editor.workspace = true
omsh-exec.workspace = true
omsh-history.workspace = true
omsh-safety.workspace = true
# Masks secrets in the line kept in the undo journal.
omsh-secrets.workspace = true
# Reads the command names of a typed line for the notification skip list.
omsh-syntax.workspace = true
omsh-ui.workspace = true

[lints]
workspace = true
