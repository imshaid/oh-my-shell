[package]
name = "omsh-cli"
description = "An interactive Linux shell with an optional AI layer (the oh-my-shell binary)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oh-my-shell"
path = "src/main.rs"

[dependencies]
# Local date and time in the `history` listing. Already in the tree through the editor.
chrono.workspace = true
clap.workspace = true
# Unpacks the release archive and checks its SHA-256 (`omsh update`, S29b).
flate2.workspace = true
ring.workspace = true
# `fancy-no-syscall` brings the graphical report renderer without the crates that probe the
# terminal; the shell does that itself, in `report.rs`.
# Ends the notification program with its group when it hangs (the same call as the prompt's
# `git`).
nix.workspace = true
miette = { workspace = true, features = ["fancy-no-syscall"] }
omsh-ai.workspace = true
omsh-config.workspace = true
omsh-editor.workspace = true
omsh-exec.workspace = true
omsh-history.workspace = true
omsh-safety.workspace = true
# Masks secrets in the line kept in the undo journal.
omsh-secrets.workspace = true
# Reads the command names of a typed line for the notification skip list.
omsh-syntax.workspace = true
omsh-ui.workspace = true

[lints]
workspace = true

# The .deb package (S29a), built by `cargo deb --no-build` in the release workflow. Paths of
# assets are relative to this crate, except `target/release/`, which cargo-deb maps to the
# real build directory. `THIRD-PARTY-LICENSES.html` is made by `cargo about` just before.
[package.metadata.deb]
name = "oh-my-shell"
maintainer = "Oh My Shell developers <noreply@github.com>"
copyright = "2026, Oh My Shell developers"
license-file = ["../../LICENSE", "0"]
section = "shells"
priority = "optional"
extended-description = """\
An interactive Linux shell that behaves like a familiar POSIX shell, helps like fish while \
you type, keeps a searchable history, checks dangerous commands before they run, and can \
optionally hand a task to an AI. Nothing the AI suggests runs without a preview and your \
confirmation."""
# $auto adds the libc version the binary was linked against. ca-certificates: HTTPS to an AI
# provider trusts the system certificate store only.
depends = "$auto, ca-certificates"
recommends = "git, libnotify-bin"
assets = [
    ["target/release/oh-my-shell", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/oh-my-shell/README.md", "644"],
    ["../../THIRD-PARTY-LICENSES.html", "usr/share/doc/oh-my-shell/THIRD-PARTY-LICENSES.html", "644"],
]
maintainer-scripts = "../../packaging/deb/"
