[package]
name = "omsh-cli"
description = "The oh-my-shell binary: argument parsing, mode selection and wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oh-my-shell"
path = "src/main.rs"

[dependencies]
clap.workspace = true
# `fancy-no-syscall` brings the graphical report renderer without the crates that probe the
# terminal; the shell does that itself, in `report.rs`.
miette = { workspace = true, features = ["fancy-no-syscall"] }
omsh-ai.workspace = true
omsh-config.workspace = true
omsh-editor.workspace = true
omsh-exec.workspace = true
omsh-history.workspace = true
omsh-safety.workspace = true
omsh-ui.workspace = true

[lints]
workspace = true
