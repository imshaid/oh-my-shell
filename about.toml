# cargo-about configuration (S29a): the file THIRD-PARTY-LICENSES.html that ships in every
# release tarball and .deb. The accepted list is the one of deny.toml; a new license needs a
# decision from the owner (see PROGRESS.md).
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# Only what the shell binary links, not the test and benchmark tools of the workspace.
ignore-dev-dependencies = true
ignore-build-dependencies = false
