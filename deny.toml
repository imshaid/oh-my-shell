# cargo-deny configuration (blueprint section 17, S19a). CI runs `cargo deny check licenses bans
# sources` as a blocking step and `cargo deny check advisories` as a step that only warns.
# The licenses below are the ones that appear in the dependency tree of the Linux build today
# (checked with `cargo metadata --filter-platform x86_64-unknown-linux-gnu`). A new license
# needs a decision from the owner and a note in PROGRESS.md.

[graph]
targets = ["x86_64-unknown-linux-gnu"]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "BSD-3-Clause",
    "0BSD",
    "Unlicense",
]

[bans]
# Two versions of one crate are a size cost, not an error. They are listed in the CI log.
multiple-versions = "warn"
wildcards = "deny"
# The workspace crates depend on each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
