[project]
name = "oh-my-shell"
version = "0.3.2"
description = "An AI-powered, natural-language Linux shell with a plan-confirm-execute safety workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Md. Shaid Hasan" },
]

# Dependency pins per blueprint Section 5.1.
# pydantic-ai is deliberately excluded — it is a full agent framework and
# conflicts with the static/deterministic architecture (Section 2.3).
dependencies = [
    "google-genai",
    "pydantic>=2.13,<3.0",
    "rich",
    "questionary",
    "prompt_toolkit",
    "psutil",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
oh-my-shell = "ohmyshell.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohmyshell"]

[tool.pytest.ini_options]
testpaths = ["tests"]