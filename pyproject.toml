[project]
name = "oh-my-shell"
version = "0.1.0"
description = "An AI-powered, natural-language Linux shell with a plan-confirm-execute safety workflow."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Md. Shaid Hasan" },
]

# Dependency pins per blueprint Section 5.1.
# pydantic-ai is deliberately excluded — it is a full agent framework and
# conflicts with the static/deterministic architecture (Section 2.3).
dependencies = [
    "ollama>=0.6.2",
    "google-generativeai",
    "pydantic>=2.13,<3.0",
    "rich",
    "questionary",
    "prompt_toolkit",
    "psutil",
    "jsonschema",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

# Google AI Studio (Gemini) is now the default/recommended provider for
# open-ended command generation (Section 7.4/7.8's updated note) — this
# project's own empirical testing found it materially more reliable than
# consumer-hardware-tier local models for this task. Ollama stays a fully
# supported, explicitly-kept rollback path (see intent_parser.py).

[project.scripts]
oh-my-shell = "ohmyshell.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ohmyshell"]

[tool.pytest.ini_options]
testpaths = ["tests"]